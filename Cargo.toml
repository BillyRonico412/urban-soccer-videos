[package]
name = "urban-soccer-videos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-status", "trace"] }
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
maud = { version = "0.27.0", features = ["axum"] }
rayon = "1.12.0"
reqwest = "0.13.5"
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
